name: Build and publish APK

on:
  repository_dispatch:
    types: [gitea_release]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string
      source_commit:
        description: Optional full private source commit for a corrected build
        required: false
        type: string
      replace_existing:
        description: Explicitly replace an existing same-version APK
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      REPLACE_EXISTING: ${{ inputs.replace_existing || false }}
      GITEA_SSH_URL: ${{ secrets.GITEA_SSH_URL }}
      GITEA_DEPLOY_KEY: ${{ secrets.GITEA_DEPLOY_KEY }}
      GITEA_KNOWN_HOSTS: ${{ secrets.GITEA_KNOWN_HOSTS }}
      PREFS_INJECT_JSON_B64: ${{ secrets.PREFS_INJECT_JSON_B64 }}
      APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
      APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
      APK_STORE_PASS: ${{ secrets.APK_STORE_PASS }}
      APK_KEY_PASS: ${{ secrets.APK_KEY_PASS }}
      APK_CERT_SHA256: ${{ secrets.APK_CERT_SHA256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate inputs and existing releases
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag'; exit 1; }
          [[ -z "$SOURCE_COMMIT" || "$SOURCE_COMMIT" =~ ^[[:xdigit:]]{40}$ ]] || { echo 'Invalid source commit'; exit 1; }
          if [[ "$REPLACE_EXISTING" == true ]]; then
            test -n "$SOURCE_COMMIT" || { echo 'Replacement requires an explicit source commit'; exit 1; }
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          for name in GITEA_SSH_URL GITEA_DEPLOY_KEY GITEA_KNOWN_HOSTS PREFS_INJECT_JSON_B64 APK_KEYSTORE_B64 APK_KEY_ALIAS APK_STORE_PASS APK_KEY_PASS APK_CERT_SHA256; do
            test -n "${!name}" || { echo "Missing secret: $name"; exit 1; }
          done
          [[ "$APK_CERT_SHA256" =~ ^[[:xdigit:]]{64}$ ]] || { echo 'Invalid signing certificate fingerprint'; exit 1; }
          if [[ "$REPLACE_EXISTING" != true ]] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace it'
            exit 1
          fi

      - name: Fetch source at release tag
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/source"
          printf '%s\n' "$GITEA_DEPLOY_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$GITEA_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 700 "$RUNNER_TEMP/ssh"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519" "$RUNNER_TEMP/ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
          git -C "$RUNNER_TEMP/source" init --quiet
          git -C "$RUNNER_TEMP/source" remote add origin "$GITEA_SSH_URL"
          git -C "$RUNNER_TEMP/source" fetch --quiet --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git -C "$RUNNER_TEMP/source" checkout --quiet --detach "refs/tags/$TAG^{commit}"
          test "$(git -C "$RUNNER_TEMP/source" cat-file -t "refs/tags/$TAG")" = tag || { echo 'Release tag must be annotated with release notes'; exit 1; }
          git -C "$RUNNER_TEMP/source" for-each-ref --format='%(contents)' "refs/tags/$TAG" > "$RUNNER_TEMP/release-notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md" || { echo 'Release tag has no release notes'; exit 1; }
          if [[ -n "$SOURCE_COMMIT" ]]; then
            git -C "$RUNNER_TEMP/source" fetch --quiet --depth=1 origin "$SOURCE_COMMIT"
            git -C "$RUNNER_TEMP/source" checkout --quiet --detach "$SOURCE_COMMIT"
            test "$(git -C "$RUNNER_TEMP/source" rev-parse HEAD)" = "$SOURCE_COMMIT"
          fi
          mkdir -p "$RUNNER_TEMP/source/app/src/main/assets"
          # PREFS_INJECT_JSON_B64 is gzip-compressed then base64-encoded so the rules stay
          # below GitHub's 48 KB secret limit. Plain base64 is still accepted for old secrets.
          printf '%s' "$PREFS_INJECT_JSON_B64" | base64 --decode > "$RUNNER_TEMP/prefs_inject.payload"
          if gzip -t "$RUNNER_TEMP/prefs_inject.payload" 2>/dev/null; then
            gunzip -c "$RUNNER_TEMP/prefs_inject.payload" > "$RUNNER_TEMP/source/app/src/main/assets/prefs_inject.json"
          else
            cp "$RUNNER_TEMP/prefs_inject.payload" "$RUNNER_TEMP/source/app/src/main/assets/prefs_inject.json"
          fi
          RULE_FILES=("$RUNNER_TEMP/source/app/src/main/assets/prefs_inject.json")
          for name in coolapk_rules.json hookvip_rules.json bili_rules.json popular_rules.json; do
            RULE_FILES+=("$RUNNER_TEMP/source/app/src/main/assets/$name")
          done
          jq -s -e 'all(.[]; type == "object") and (([.[] | keys[]] | length) == ([.[] | keys[]] | unique | length))' \
            "${RULE_FILES[@]}" >/dev/null || { echo 'Invalid or duplicate rule packages'; exit 1; }
          jq -s -r '.[] | to_entries[] | select(.value | type == "object") | .key' \
            "${RULE_FILES[@]}" | LC_ALL=C sort > "$RUNNER_TEMP/rule-packages"
          LC_ALL=C sort "$RUNNER_TEMP/source/app/src/main/resources/META-INF/xposed/scope.list" \
            > "$RUNNER_TEMP/scope-packages"
          if ! diff -u "$RUNNER_TEMP/scope-packages" "$RUNNER_TEMP/rule-packages"; then
            echo 'Injected rules do not match this release tag; update PREFS_INJECT_JSON_B64'
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        shell: bash
        working-directory: ${{ runner.temp }}/source
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -f "$SDK_ROOT/platforms/android-37.0/android.jar" || { echo 'Android SDK platform 37.0 missing'; exit 1; }
          if ! bash ./gradlew --no-daemon --console=plain :app:assembleRelease > "$RUNNER_TEMP/gradle-build.log" 2>&1; then
            echo 'Gradle build failed; last 250 log lines:'
            tail -n 250 "$RUNNER_TEMP/gradle-build.log"
            exit 1
          fi

      - name: Check version and sign APK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -d "$SDK_ROOT/build-tools" || { echo 'Android build tools missing'; exit 1; }
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          UNSIGNED="$RUNNER_TEMP/source/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED" || { echo 'Unsigned APK missing'; exit 1; }
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$UNSIGNED" | sed -n '1p')"
          [[ "$BADGING" == *"versionName='${TAG#v}'"* ]] || { echo 'APK versionName does not match release tag'; exit 1; }
          if [[ "$REPLACE_EXISTING" == true ]]; then
            mkdir -p "$RUNNER_TEMP/previous"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "VIPFucker-$TAG.apk" --dir "$RUNNER_TEMP/previous"
            PREVIOUS="$RUNNER_TEMP/previous/VIPFucker-$TAG.apk"
            OLD_CODE="$("$BUILD_TOOLS/aapt" dump badging "$PREVIOUS" | sed -n "1s/.*versionCode='\([^']*\)'.*/\1/p")"
            NEW_CODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING")"
            test -n "$OLD_CODE"
            test "$NEW_CODE" = "$OLD_CODE" || { echo 'Replacement must retain versionCode'; exit 1; }
            OLD_SIGNER="$("$BUILD_TOOLS/apksigner" verify --min-sdk-version 26 --print-certs "$PREVIOUS")"
            [[ "${OLD_SIGNER,,}" == *"sha-256 digest: ${APK_CERT_SHA256,,}"* ]] || { echo 'Previous signing certificate mismatch'; exit 1; }
          fi
          printf '%s' "$APK_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$APK_KEY_ALIAS" \
            --ks-pass env:APK_STORE_PASS --key-pass env:APK_KEY_PASS \
            --out "$RUNNER_TEMP/VIPFucker-$TAG.apk" "$UNSIGNED" > /dev/null
          SIGNER_INFO="$("$BUILD_TOOLS/apksigner" verify --min-sdk-version 26 --print-certs "$RUNNER_TEMP/VIPFucker-$TAG.apk")"
          [[ "${SIGNER_INFO,,}" == *"sha-256 digest: ${APK_CERT_SHA256,,}"* ]] || { echo 'Unexpected signing certificate'; exit 1; }

      - uses: actions/checkout@v4

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REPLACE_EXISTING" == true ]]; then
            NAME="VIPFucker-$TAG.apk"
            TEMP_NAME="VIPFucker-$TAG-${GITHUB_RUN_ID}.apk"
            cp "$RUNNER_TEMP/$NAME" "$RUNNER_TEMP/$TEMP_NAME"
            gh release upload "$TAG" "$RUNNER_TEMP/$TEMP_NAME" --repo "$GITHUB_REPOSITORY"
            RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')"
            ASSETS="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets")"
            NEW_ID="$(jq -r --arg name "$TEMP_NAME" '.[] | select(.name == $name) | .id' <<< "$ASSETS")"
            OLD_ID="$(jq -r --arg name "$NAME" '.[] | select(.name == $name) | .id' <<< "$ASSETS")"
            test -n "$NEW_ID"
            test -n "$OLD_ID"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD_ID"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$NEW_ID" -f name="$NAME" >/dev/null
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > "$RUNNER_TEMP/corrected-notes.md"
            COUNT="$(grep -c '[^[:space:]]' "$RUNNER_TEMP/source/app/src/main/resources/META-INF/xposed/scope.list")"
            printf '\n\n### Corrected same-version build\nSource: `%s`. Target packages: %s. Version remains unchanged; download and install manually.\n' "$SOURCE_COMMIT" "$COUNT" >> "$RUNNER_TEMP/corrected-notes.md"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/corrected-notes.md"
          else
            gh release create "$TAG" "$RUNNER_TEMP/VIPFucker-$TAG.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --title "VIPFucker $TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
